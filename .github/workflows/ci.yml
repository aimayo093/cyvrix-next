name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: CI checks code, it never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag cannot change
      # what runs here. Dependabot updates the pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # matches package.json engines
          cache: npm

      - run: npm ci
      # Fails on any moderate or worse advisory in a production dependency,
      # except one listed in scripts/audit-exceptions.json for the packages it
      # names, until its review date (docs/DECISIONS.md, "An advisory with no fix").
      - name: Audit production dependencies
        run: npm run audit:gate
      - run: npx tsc --noEmit
      - name: Lint (zero warnings, so the backlog cannot creep back)
        run: npx eslint . --max-warnings=0
      - run: npm run check:claims
      # Regenerated first, so tests that read it (test:appsec) see this
      # commit's source, never a stale manifest.
      - name: Refresh the Security Center code scan
        run: npm run scan:code

      - name: Tests
        run: |
          npm run test:dashboard
          npm run test:appsec
          npm run test:enquiry-source
          npm run test:email-history
          npm run test:legal-notices
          npm run test:password-reset
          npm run test:ticket-access
          npm run test:totp
          npm run test:mfa
          npm run test:scan
          npm run test:feed
          npm run test:paperclip
          npm run test:audit-gate
      - name: Production build
        # No database in CI; the build falls back as it does locally.
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build
        run: npm run build
